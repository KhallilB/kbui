name: release
on:
  push:
    branches: [main]

concurrency: release

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}", fetch-depth: 0 }
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # Release PRs opened by GITHUB_TOKEN skip ci.yml, so the tag is checked here.
      - run: bun run check
      - run: bun run test:stories
      - name: Pack every published package
        run: |
          mkdir release
          for dir in packages/*/; do
            if [ "$(jq -r '.private // false' "$dir/package.json")" != true ]; then
              (cd "$dir" && bun pm pack --quiet --destination "$GITHUB_WORKSPACE/release")
            fi
          done
          ls release
      - run: gh release upload "$TAG" release/*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
