name: release
on:
  push:
    branches: [main]

concurrency: release

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Releases first and alone: a flaky PR update must not hide a created release.
      - id: release
        uses: googleapis/release-please-action@v4
        with: { skip-github-pull-request: true }
      - uses: googleapis/release-please-action@v4
        with: { skip-github-release: true }

  assets:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}", fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - name: Trust checkout in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bun install --frozen-lockfile
      # Release PRs opened by GITHUB_TOKEN skip ci.yml, so the tag is checked here.
      - run: bun run check
      - run: bun run test:stories
      - name: Pack every published package
        run: |
          mkdir release
          for dir in packages/*/; do
            if [ "$(bun -e 'console.log((await Bun.file(process.argv[1]).json()).private ?? false)' "$dir/package.json")" != true ]; then
              (cd "$dir" && bun pm pack --quiet --destination "$GITHUB_WORKSPACE/release")
            fi
          done
          ls release
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.TAG }}
          path: release/*.tgz
          if-no-files-found: error

  upload:
    needs: [release-please, assets]
    if: ${{ !cancelled() && needs.assets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ env.TAG }}
          path: release
      - run: gh release upload "$TAG" release/*.tgz --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  install:
    needs: [release-please, upload]
    if: ${{ !cancelled() && needs.upload.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.release-please.outputs.tag_name }}" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      # Outside the checkout, so Bun cannot treat it as a kbui workspace.
      - run: cp -r .github/consumer "$RUNNER_TEMP/consumer"
      - name: Install the release as a consumer would
        working-directory: ${{ runner.temp }}/consumer
        run: |
          bun add "$URL/kbui-react-$VERSION.tgz" "$URL/kbui-css-$VERSION.tgz"
          bun install --frozen-lockfile
          bun node_modules/@kbui/react/dist/check-versions.js
          bunx tsc -p .
          bun smoke.ts
