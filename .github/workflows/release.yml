name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

concurrency: release

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.retry.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.retry.outputs.tag_name }}
      version: ${{ steps.release.outputs.version || steps.retry.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Releases first and alone: a flaky PR update must not hide a created release.
      - id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@v4
        with: { skip-github-pull-request: true }
      - name: Resolve release retry
        id: retry
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          RETRY_TAG: ${{ inputs.tag }}
        with:
          script: |
            const tag = process.env.RETRY_TAG;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected release tag vX.Y.Z');
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            if (release.draft) throw new Error('Release is a draft');
            core.setOutput('release_created', 'true');
            core.setOutput('tag_name', release.tag_name);
            core.setOutput('version', tag.slice(1));
      - name: Keep npm scopes out of contributors
        if: steps.release.outputs.release_created == 'true'
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        with:
          script: |
            const { cleanReleaseNotes } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-mentions.mjs`);
            await cleanReleaseNotes(github, context.repo, process.env.TAG);
      - uses: googleapis/release-please-action@v4
        if: github.event_name == 'push'
        with: { skip-github-release: true }

  assets:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}", fetch-depth: 0 }
      - name: Install pinned Bun
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Trust checkout in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bun install --frozen-lockfile
      # Release PRs opened by GITHUB_TOKEN skip ci.yml, so the tag is checked here.
      - run: bun run check
      - run: bun run test:stories
      - name: Pack every published package
        if: github.event_name != 'workflow_dispatch'
        run: |
          mkdir release
          for dir in packages/*/; do
            if [ "$(bun -e 'console.log((await Bun.file(process.argv[1]).json()).private ?? false)' "$dir/package.json")" != true ]; then
              (cd "$dir" && bun pm pack --quiet --destination "$GITHUB_WORKSPACE/release")
            fi
          done
          ls release
      - name: Reuse uploaded release tarballs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo, tag: process.env.TAG,
            });
            const assets = ['tokens', 'css', 'react'].map((name) => {
              const filename = `kb.ui-${name}-${process.env.VERSION}.tgz`;
              const asset = release.assets.find((candidate) => candidate.name === filename);
              if (!asset) throw new Error(`Missing release asset ${filename}`);
              return asset;
            });
            fs.mkdirSync('release', { recursive: true });
            for (const asset of assets) {
              const response = await fetch(asset.browser_download_url);
              if (!response.ok) throw new Error(`Download failed for ${asset.name}: ${response.status}`);
              fs.writeFileSync(`release/${asset.name}`, new Uint8Array(await response.arrayBuffer()));
            }
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.TAG }}
          path: release/*.tgz
          if-no-files-found: error

  upload:
    needs: [release-please, assets]
    if: ${{ !cancelled() && needs.assets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ env.TAG }}
          path: release
      - if: github.event_name != 'workflow_dispatch'
        run: gh release upload "$TAG" release/*.tgz --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  install:
    needs: [release-please, upload]
    if: ${{ !cancelled() && needs.upload.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.release-please.outputs.tag_name }}" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      # Outside the checkout, so Bun cannot treat it as a kbui workspace.
      - run: cp -r .github/consumer "$RUNNER_TEMP/consumer"
      - name: Install the release as a consumer would
        working-directory: ${{ runner.temp }}/consumer
        run: |
          bun add "$URL/kb.ui-react-$VERSION.tgz"
          bun install --frozen-lockfile
          bun node_modules/@kb.ui/react/dist/check-versions.js
          bunx tsc -p .
          bun smoke.ts

  # Same tarballs as the GitHub release, published only after every OS installed them.
  publish:
    needs: [release-please, install]
    if: ${{ !cancelled() && needs.install.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: GitHub OIDC replaces a stored token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.release-please.outputs.tag_name }}
          path: release
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11.6.2
      - name: Publish each tarball to npm
        run: |
          for tgz in ./release/*.tgz; do
            spec=$(tar -xOzf "$tgz" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); `${p.name}@${p.version}`')
            # Legacy scope unavailable; keep those releases on GitHub tarballs.
            if [[ "$spec" == @kbui/* ]]; then
              echo "$spec is distributed through GitHub Releases only"
              continue
            fi
            # npm refuses a version twice, so a rerun skips what already landed.
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already on npm"
            else
              npm publish "$tgz" --access public
            fi
          done
      - name: Verify published READMEs and integrity
        run: node scripts/release-readmes.ts release
        env:
          ALLOW_HISTORICAL: ${{ github.event_name == 'workflow_dispatch' }}
