name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bun scripts/ci-scope.ts "$BASE_SHA" "$HEAD_SHA"
      - run: bun run check
      - name: Compile documentation without browsers
        if: steps.scope.outputs.browser != 'true'
        run: bun run --filter @kbui/storybook build-storybook

  browser:
    name: Validate site
    needs: check
    if: needs.check.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - run: bun install --frozen-lockfile
      - run: npm ci --prefix deployment/site
      - run: npm test --prefix deployment/site
      - run: bun run build
      - run: bun run test:stories
      - run: bun run --cwd apps/storybook test:site
      - run: bun run --cwd apps/storybook build:site
      - run: bun scripts/site-stage.ts
      - name: Validate staged site in Chromium and WebKit
        run: |
          python3 -m http.server 4175 --bind 127.0.0.1 --directory deployment/site/public &
          site_server_pid=$!
          trap 'kill "$site_server_pid"' EXIT
          curl --fail --retry 8 --retry-connrefused --retry-delay 1 http://127.0.0.1:4175/ > /dev/null
          CATALOG_PREVIEW_URL=http://127.0.0.1:4175 bun run --cwd apps/storybook verify:release
      - run: npm run build --prefix deployment/site
      - run: npm run check --prefix deployment/site
