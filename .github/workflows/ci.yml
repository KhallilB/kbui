name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: "Check: code"
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bun scripts/ci-scope.ts "$BASE_SHA" "$HEAD_SHA"
      - name: Build packages
        run: bun run build
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Check examples
        run: bun run --filter @kb.ui/storybook verify:code
      - name: Run tests
        run: bun run test
      - name: Check packages
        run: bun run test:pack
      - name: Build Storybook
        if: steps.scope.outputs.browser != 'true'
        run: bun run --cwd apps/storybook build-storybook --output-dir dist/storybook
      - name: Save preview
        if: steps.scope.outputs.browser != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: storybook-${{ github.sha }}
          path: apps/storybook/dist/storybook/
          if-no-files-found: error
          retention-days: 3

  browser-tests:
    name: ${{ matrix.name }}
    needs: [check]
    if: needs.check.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: stories
            name: "Test: stories"
          - suite: themes
            name: "Test: themes"
          - suite: responsive
            name: "Test: layouts"
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Trust checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build
      - name: ${{ matrix.name }}
        run: bun run validate:site ${{ matrix.suite }}

  browser-built:
    name: "Test: site"
    needs: [check]
    if: needs.check.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Trust checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build
      - name: Check site
        run: bun run validate:site built
      - name: Save preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: storybook-${{ github.sha }}
          path: apps/storybook/dist/storybook/
          if-no-files-found: error
          retention-days: 3

  browser:
    name: "Gate: validation"
    needs: [check, browser-tests, browser-built]
    if: always() && needs.check.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          SUITES_RESULT: ${{ needs.browser-tests.result }}
          BUILT_RESULT: ${{ needs.browser-built.result }}
        run: |
          test "$SUITES_RESULT" = success
          test "$BUILT_RESULT" = success

  preview:
    name: "Deploy: preview"
    needs: [check, browser]
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.check.result == 'success' &&
      (needs.browser.result == 'success' || needs.browser.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: kbui-preview
      url: https://pr-${{ github.event.number }}-kbui-site-preview.khallilbailey.workers.dev
    env:
      CF_SEND_TELEMETRY: 'false'
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - run: npm ci --prefix deployment/site
      - uses: actions/download-artifact@v4
        with:
          name: storybook-${{ github.sha }}
          path: deployment/site/public
      - name: Package preview
        run: npm run build:preview --prefix deployment/site
      - name: Check upload
        run: npm run upload:preview --prefix deployment/site -- --preview-alias "pr-${PR_NUMBER}" --dry-run
      - name: Deploy preview
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in the kbui-preview environment}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID in the kbui-preview environment}"
          npm run configure:preview --prefix deployment/site
          npm run upload:preview --prefix deployment/site -- --preview-alias "pr-${PR_NUMBER}" --message "PR ${PR_NUMBER} ${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Post preview link
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- kbui-storybook-preview -->';
            const issue_number = context.payload.number;
            const url = `https://pr-${issue_number}-kbui-site-preview.khallilbailey.workers.dev`;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: issue_number, per_page: 100,
            });
            const changed = new Set(files.map(file => file.filename));
            const { entries } = JSON.parse(require('node:fs').readFileSync('deployment/site/public/index.json', 'utf8'));
            const sourcePath = path => require('node:path').posix.normalize(`apps/storybook/${path}`);
            const affected = Object.values(entries).filter(entry =>
              (entry.type === 'story' || (entry.type === 'docs' && entry.importPath.endsWith('.mdx'))) &&
              (changed.has(sourcePath(entry.importPath)) ||
                (entry.componentPath && changed.has(sourcePath(entry.componentPath))))
            );
            const label = text => text.replace(/[\\\[\]`*_<>]/g, '\\$&').replace(/\s+/g, ' ');
            const links = affected.slice(0, 40).map(entry => {
              const route = entry.type === 'docs' ? 'docs' : 'story';
              return `- [${label(`${entry.title} / ${entry.name}`)}](${url}/?path=/${route}/${encodeURIComponent(entry.id)})`;
            });
            const changedStories = links.length ? [
              '### Changed stories',
              'Stories from changed story, documentation or component files.',
              ...links,
              ...(affected.length > links.length ? [`Showing ${links.length} of ${affected.length} matching entries.`] : []),
            ].join('\n\n') : '';
            const body = [marker, changedStories, `[Browse all stories](${url})`,
              `Updated for commit ${context.payload.pull_request.head.sha}.`,
            ].filter(Boolean).join('\n\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
