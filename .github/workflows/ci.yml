name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bun scripts/ci-scope.ts "$BASE_SHA" "$HEAD_SHA"
      - run: bun run check
      - name: Compile documentation without browsers
        if: steps.scope.outputs.browser != 'true'
        run: bun run --cwd apps/storybook build-storybook --output-dir dist/storybook
      - name: Retain Storybook for PR preview
        if: steps.scope.outputs.browser != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: storybook-${{ github.sha }}
          path: apps/storybook/dist/storybook/
          if-no-files-found: error
          retention-days: 3

  browser:
    name: Validate site
    needs: check
    if: needs.check.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bun
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Trust checkout in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run validate:site
      - name: Retain Storybook for PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: storybook-${{ github.sha }}
          path: apps/storybook/dist/storybook/
          if-no-files-found: error
          retention-days: 3

  preview:
    name: Storybook preview
    needs: [check, browser]
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.check.result == 'success' &&
      (needs.browser.result == 'success' || needs.browser.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: kbui-preview
      url: https://pr-${{ github.event.number }}-kbui-site-preview.khallilbailey.workers.dev
    env:
      CF_SEND_TELEMETRY: 'false'
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - run: npm ci --prefix deployment/site
      - uses: actions/download-artifact@v4
        with:
          name: storybook-${{ github.sha }}
          path: deployment/site/public
      - name: Package existing Storybook files
        run: npm run build:preview --prefix deployment/site
      - name: Check preview upload
        run: npm run upload:preview --prefix deployment/site -- --preview-alias "pr-${PR_NUMBER}" --dry-run
      - name: Publish Storybook preview
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in the kbui-preview environment}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID in the kbui-preview environment}"
          npm run configure:preview --prefix deployment/site
          npm run upload:preview --prefix deployment/site -- --preview-alias "pr-${PR_NUMBER}" --message "PR ${PR_NUMBER} ${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment Storybook preview
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- kbui-storybook-preview -->';
            const issue_number = context.payload.number;
            const url = `https://pr-${issue_number}-kbui-site-preview.khallilbailey.workers.dev`;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: issue_number, per_page: 100,
            });
            const changed = new Set(files.map(file => file.filename));
            const { entries } = JSON.parse(require('node:fs').readFileSync('deployment/site/public/index.json', 'utf8'));
            const sourcePath = path => require('node:path').posix.normalize(`apps/storybook/${path}`);
            const affected = Object.values(entries).filter(entry =>
              (entry.type === 'story' || (entry.type === 'docs' && entry.importPath.endsWith('.mdx'))) &&
              (changed.has(sourcePath(entry.importPath)) ||
                (entry.componentPath && changed.has(sourcePath(entry.componentPath))))
            );
            const label = text => text.replace(/[\\\[\]`*_<>]/g, '\\$&').replace(/\s+/g, ' ');
            const links = affected.slice(0, 40).map(entry => {
              const route = entry.type === 'docs' ? 'docs' : 'story';
              return `- [${label(`${entry.title} / ${entry.name}`)}](${url}/?path=/${route}/${encodeURIComponent(entry.id)})`;
            });
            const changedStories = links.length ? [
              '### Changed stories',
              'Stories from changed story, documentation or component files.',
              ...links,
              ...(affected.length > links.length ? [`Showing ${links.length} of ${affected.length} matching entries.`] : []),
            ].join('\n\n') : '';
            const body = [marker, changedStories, `[Browse all stories](${url})`,
              `Updated for commit ${context.payload.pull_request.head.sha}.`,
            ].filter(Boolean).join('\n\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
