name: Clean up PR preview

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: kbui-preview-${{ github.event.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    environment: kbui-preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Delete closed PR versions
        uses: actions/github-script@v7
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          script: |
            const { cleanupPreview } = await import(`${process.env.GITHUB_WORKSPACE}/deployment/site/cleanup-preview.mjs`);
            await cleanupPreview({ github, context });
