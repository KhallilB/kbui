name: Validate and deploy kbui site

on:
  push:
    branches: [main]
    paths:
      - 'apps/storybook/**'
      - 'packages/**'
      - 'deployment/site/**'
      - 'scripts/site-stage*'
      - 'scripts/validate-site.sh'
      - '.github/workflows/deploy-site.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'mise.toml'
      - '!**/*.md'
      - 'packages/react/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kbui-site-${{ github.ref }}
  cancel-in-progress: false

env:
  CF_SEND_TELEMETRY: 'false'

jobs:
  build:
    name: Validate production artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Trust checkout in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run validate:site
      - uses: actions/upload-artifact@v4
        with:
          name: kbui-site-${{ github.sha }}
          path: deployment/site/.cloudflare/output/
          include-hidden-files: true
          retention-days: 14

  deploy:
    name: Deploy production artifact
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: kbui-production
      url: https://kbui.kcb.pro/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - run: npm ci --prefix deployment/site
      - uses: actions/download-artifact@v4
        with:
          name: kbui-site-${{ github.sha }}
          path: deployment/site/.cloudflare/output/
      - name: Deploy the tested artifact
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in the kbui-production environment}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID in the kbui-production environment}"
          npm run deploy --prefix deployment/site -- --message "Site ${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check production setup page
        run: curl --fail --retry 5 --retry-all-errors --silent --show-error https://kbui.kcb.pro/setup/ | grep -Fq '<title>Get started — kbui</title>'
